<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="canonical" href="https://kai-website-khaki.vercel.app/" />
    <title>kai — One terminal. Every platform.</title>
    <meta name="description" content="kai is a fast, keyboard-first terminal for Windows, Linux and macOS. Native Rust PTY, GPU render, local AI CLIs. Free, MIT, zero telemetry." />
    <meta property="og:title" content="kai — One terminal. Every platform." />
    <meta property="og:description" content="Native Rust PTY · 60fps xterm.js · ~30MB idle · local Codex/Claude/Gemini CLIs. Free MIT, zero telemetry." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kai-website-khaki.vercel.app/" />
    <meta property="og:image" content="https://kai-website-khaki.vercel.app/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="kai — One terminal. Every platform." />
    <meta name="twitter:description" content="Fast terminal for devs. Tauri 2 + Rust, ~30MB idle, BYO AI CLIs. MIT." />
    <meta name="twitter:image" content="https://kai-website-khaki.vercel.app/og.png" />
    <meta name="theme-color" content="#070a12" />
    <script>
      try {
        var t = localStorage.getItem('kai-theme');
        if (t !== 'light' && t !== 'dark') {
          t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t;
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
