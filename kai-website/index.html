<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="canonical" href="https://kai-terminal.vercel.app/" />
    <title>Kai — Terminal for macOS, Linux, Windows</title>
    <meta name="description" content="Kai is a Tauri + Rust terminal with a local CLI for AI context. MIT licensed. Pick your own installer on GitHub Releases." />
    <meta property="og:title" content="Kai — Terminal for macOS, Linux, Windows" />
    <meta property="og:description" content="Desktop terminal + local CLI for AI context. MIT. macOS .dmg, Linux .deb/.AppImage, Windows .exe/.msi." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kai-terminal.vercel.app/" />
    <meta property="og:image" content="https://kai-terminal.vercel.app/og.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kai — Terminal for macOS, Linux, Windows" />
    <meta name="twitter:description" content="Tauri + Rust terminal. MIT. Installers for macOS, Linux, Windows." />
    <meta name="twitter:image" content="https://kai-terminal.vercel.app/og.png" />
    <meta name="theme-color" content="#070a12" />
    <script>document.documentElement.classList.add('js');</script>
    <script>
      try {
        var t = localStorage.getItem('kai-theme');
        if (t !== 'light' && t !== 'dark') {
          t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t;
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
