<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kai — Desktop terminal for Windows, Linux, and macOS with AI context intelligence, local MCP, and Git diff review." />
    <meta name="referrer" content="no-referrer-when-downgrade" />
    <meta name="theme-color" content="#0b0d10" />
    <title>Kai — One Terminal. Every Platform.</title>
    <style>
      /* Painted before any script or stylesheet loads, so the window never shows a
         blank white frame while the app starts. The boot script below sets data-theme
         from the saved settings; the colors match getThemeCanvasColor. */
      html { background: #0b0d10; }
      html[data-theme="one-dark"] { background: #1e2227; }
      html[data-theme="dracula"] { background: #1e1f29; }
      html[data-theme="tokyo-night"] { background: #16161e; }
      html[data-theme="catppuccin-mocha"] { background: #181825; }
      html[data-theme="gruvbox-dark"] { background: #1e1e1e; }
      html[data-theme="nord"] { background: #242933; }
      html[data-theme="solarized-dark"] { background: #00212b; }
      html[data-theme="rose-pine"] { background: #16141f; }
    </style>
    <script>
      (function () {
        try {
          var raw =
            localStorage.getItem("kai_user_settings") ||
            localStorage.getItem("terminal_user_settings");
          if (raw) {
            var s = JSON.parse(raw);
            if (s && s.theme) {
              // A removed theme (e.g. "kali", "monokai", the light themes) falls back to the default.
              var colors = {
                "kai-dark": "#0b0d10",
                "gruvbox-dark": "#1e1e1e",
                "catppuccin-mocha": "#181825",
                "tokyo-night": "#16161e",
                nord: "#242933",
                dracula: "#1e1f29",
                "solarized-dark": "#00212b",
                "one-dark": "#1e2227",
                "rose-pine": "#16141f",
              };
              var theme = colors.hasOwnProperty(s.theme) ? s.theme : "kai-dark";
              document.documentElement.setAttribute("data-theme", theme);
              document.documentElement.style.colorScheme = "dark";
              var m = document.querySelector('meta[name="theme-color"]');
              if (m) m.setAttribute("content", colors[theme]);
            }
            // See-through window (Windows / Linux desktop app): apply the saved
            // opacity before first paint so the chrome never flashes opaque.
            var op = s && typeof s.opacity === "number" ? s.opacity : 1;
            var desktop = "__TAURI_INTERNALS__" in window && !/mac/i.test(navigator.platform);
            if (desktop && op < 1) {
              document.documentElement.style.setProperty(
                "--win-alpha",
                String(Math.max(0.2, Math.min(1, op)))
              );
              document.documentElement.classList.add("win-translucent");
            }
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
