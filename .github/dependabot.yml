# Weekly pull requests for outdated or vulnerable dependencies. Each is an ordinary PR: CI runs
# on it, and nothing is merged automatically. (The bundled Node.js runtime has its own weekly
# job, see workflows/bundled-node.yml.)
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: "/tools/lint"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
