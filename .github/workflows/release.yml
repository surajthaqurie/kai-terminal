name: Release Packages

# Builds installable bundles on native runners and publishes tagged releases.
# - Native runners only: no cross-compilation is treated as native testing.
# - Quality gates (format, lint, typecheck, tests) must pass before any bundle.
# - Build failures stop release publication (build -> publish dependency).
# - Signing credentials come only from GitHub Actions secrets; none are committed.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version label used for artifact names (e.g. v0.1.0)"
        required: false
        default: "v0.1.0"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ------------------------------------------------------------------
  # Quality gate: must pass before any platform bundle is built.
  # ------------------------------------------------------------------
  gate:
    name: Quality gate (format, lint, typecheck, tests)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22 environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Frontend Formatting Check
        run: npm run format:check

      - name: Frontend TypeScript Typecheck
        run: npm run typecheck

      - name: Frontend Vitest Unit Tests
        run: npm run test

      - name: Rust Formatting Check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Rust Clippy Lint
        run: cargo clippy --no-default-features --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust Unit Tests
        run: cargo test --no-default-features --manifest-path src-tauri/Cargo.toml --lib

      - name: Real PTY Integration Tests (Linux)
        run: cargo test --no-default-features --manifest-path src-tauri/Cargo.toml --test pty_integration_tests -- --nocapture

      - name: Build Web Frontend Bundle
        run: npm run build

  # ------------------------------------------------------------------
  # Native platform bundles. Each entry runs on its own OS so the
  # artifact is genuinely built and tested on that platform.
  # ------------------------------------------------------------------
  build:
    name: Bundle (${{ matrix.target-name }})
    needs: gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-22.04
            target-name: linux-x86_64
            artifact-suffix: linux-x86_64
            bundles: deb,appimage
          - os: ubuntu-24.04-arm
            target-name: linux-aarch64
            artifact-suffix: linux-aarch64
            bundles: deb,appimage
          - os: windows-latest
            target-name: windows-x86_64
            artifact-suffix: windows-x86_64
            bundles: nsis,msi
          - os: macos-14
            target-name: macos-aarch64
            artifact-suffix: macos-aarch64
            bundles: dmg,app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22 environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Tauri bundles (${{ matrix.bundles }})
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater signing key (optional; only from secrets, never committed).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: .
          args: --bundles ${{ matrix.bundles }}

      - name: Optional Windows Authenticode signing (only when secrets exist)
        if: runner.os == 'Windows'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          # Signing is intentionally minimal here: decode the PFX from secrets
          # into a temp file, sign NSIS/MSI outputs, then delete the temp file.
          # Without secrets this step skips and the build stays an unsigned test build.
          if (-not $env:WINDOWS_CERTIFICATE) { Write-Host "No WINDOWS_CERTIFICATE secret; skipping signing (unsigned test build)."; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          try {
            $files = Get-ChildItem -Path src-tauri\target\release\bundle -Recurse -Include *.exe, *.msi -File
            if (-not $files) { Write-Error "No Windows installer files found to sign."; exit 1 }
            foreach ($f in $files) {
              & signtool sign /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 $f.FullName
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Optional macOS codesign + notarize (only when secrets exist)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "No APPLE_CERTIFICATE secret; skipping signing (unsigned test build)."
            exit 0
          fi
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/apple.p12"
          trap 'rm -f "$RUNNER_TEMP/apple.p12"' EXIT
          security create-keychain -p temp-pwd build.kc || true
          security import "$RUNNER_TEMP/apple.p12" -k build.kc -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          APP_BUNDLE=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name "*.app" | head -n 1)
          DMG=$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name "*.dmg" | head -n 1)
          test -n "${APP_BUNDLE:-}" || { echo "No .app bundle found"; exit 1; }
          test -n "${DMG:-}" || { echo "No .dmg found"; exit 1; }
          codesign --deep --force --options runtime --sign "$APPLE_SIGNING_IDENTITY" "$APP_BUNDLE"
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$DMG"

      - name: Normalize bundle artifact names to lowercase
        shell: bash
        run: |
          set -euo pipefail
          echo "Enforcing lowercase bundle filenames..."
          find src-tauri/target/release/bundle -type f | while read -r filepath; do
            dir=$(dirname "$filepath")
            filename=$(basename "$filepath")
            lower_filename=$(echo "$filename" | sed -e 's/^Kai_/kai_/' -e 's/^KAI_/kai_/')
            if [ "$filename" != "$lower_filename" ]; then
              echo "Renaming $filename -> $lower_filename"
              mv "$filepath" "$dir/$lower_filename"
            fi
          done

      - name: Verify bundle artifacts exist for this platform
        shell: bash
        run: |
          set -euo pipefail
          echo "Listing bundle output:"
          find src-tauri/target/release/bundle -type f | sort
          case "${{ matrix.target-name }}" in
            linux-*)
              ls src-tauri/target/release/bundle/deb/*.deb
              ls src-tauri/target/release/bundle/appimage/*.AppImage
              file src-tauri/target/release/bundle/deb/*.deb
              ;;
            windows-*)
              ls src-tauri/target/release/bundle/nsis/*.exe
              ls src-tauri/target/release/bundle/msi/*.msi
              ;;
            macos-*)
              ls src-tauri/target/release/bundle/dmg/*.dmg
              ls -d src-tauri/target/release/bundle/macos/*.app
              ;;
            *)
              echo "Unknown target ${{ matrix.target-name }}"; exit 1 ;;
          esac
          echo "Artifact verification passed for ${{ matrix.target-name }}."

      - name: Upload workflow artifacts (version, OS, arch in name)
        uses: actions/upload-artifact@v4
        with:
          name: kai-${{ github.ref_name || inputs.version }}-${{ matrix.artifact-suffix }}
          # Upload only final installers. Do NOT use bundle/**/*: that captures
          # intermediates (AppDir contents, deb control/data.tar.gz,
          # dmg support files, share/create-dmg, .app directories) which then
          # break the publish verification (nested layout, junk files).
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.dmg
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Publish verified artifacts to GitHub Releases. Runs only when every
  # gate + bundle job succeeded, so build failures stop publication.
  # ------------------------------------------------------------------
  publish:
    name: Publish GitHub Release
    needs: [gate, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Verify expected files before publication
        shell: bash
        run: |
          set -euo pipefail
          echo "Staged release files before normalization:"
          find release-artifacts -type f | sort
          # Enforce lowercase prefix (kai_) across all downloaded platform artifacts
          find release-artifacts -type f | while read -r filepath; do
            dir=$(dirname "$filepath")
            filename=$(basename "$filepath")
            lower_filename=$(echo "$filename" | sed -e 's/^Kai_/kai_/' -e 's/^KAI_/kai_/')
            if [ "$filename" != "$lower_filename" ]; then
              echo "Renaming $filename -> $lower_filename"
              mv "$filepath" "$dir/$lower_filename"
            fi
          done
          echo "Staged release files after normalization:"
          find release-artifacts -type f | sort
          # Artifacts are downloaded with merge-multiple:true, so each platform's
          # installers land in subdirectories (deb/, appimage/, nsis/, msi/, dmg/).
          # Use recursive search — a flat `ls release-artifacts/*.deb` fails with
          # exit code 2 because no .deb exists at the top level.
          fail=0
          check() {
            local label="$1"
            local pattern="$2"
            echo "--- $label ($pattern) ---"
            local matches
            matches=$(find release-artifacts -type f -name "$pattern" | sort)
            if [ -z "$matches" ]; then
              matches=$(find release-artifacts -type f -iname "$pattern" | sort)
            fi
            if [ -z "$matches" ]; then
              echo "MISSING: no $label files found"
              fail=1
            else
              echo "$matches"
              echo "OK: found $(echo "$matches" | wc -l) $label file(s)."
            fi
          }
          check "Linux .deb" "*.deb"
          check "Linux .AppImage" "*.AppImage"
          check "Windows installer .exe" "*.exe"
          check "Windows .msi" "*.msi"
          check "macOS .dmg" "*.dmg"
          if [ "$fail" -ne 0 ]; then
            echo "Artifact verification failed."
            exit 1
          fi
          echo "All expected platform artifacts are present."

      - name: Create GitHub Release with verified artifacts
        uses: softprops/action-gh-release@v2
        with:
          # Recursive globs: installers are nested (deb/, appimage/, nsis/,
          # msi/, dmg/) after merge-multiple. A flat `release-artifacts/*`
          # misses them and would attach junk intermediates if upload is broad.
          files: |
            release-artifacts/**/*.deb
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.appimage
            release-artifacts/**/*.exe
            release-artifacts/**/*.msi
            release-artifacts/**/*.dmg
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Kai Terminal ${{ github.ref_name }}

            ### Verified builds (native runners)
            - Linux x86_64 (Ubuntu 22.04): `.deb`, `.AppImage`
            - Linux ARM64 (Ubuntu 24.04 ARM): `.deb`, `.AppImage`
            - Windows x86_64: NSIS `.exe`, MSI `.msi`
            - macOS Apple Silicon (macOS 14): `.dmg`

            ### Not configured / untested — do not treat as supported
            - Windows ARM64: not built or tested.
            - macOS Intel (x86_64): not built on native Intel hardware; no cross-compiled
              binary is published as a tested release.
            - Other Linux distributions/formats (RPM, Snap, Flatpak): not produced or verified.
              The `.deb` is verified on Ubuntu 22.04; other Debian derivatives may work but
              are not claimed as supported.

            ### Signing status
            - Windows/macOS binaries are signed only when the corresponding GitHub Actions
              secrets are configured. Without secrets, artifacts are unsigned test builds.
            - Unsigned macOS `.dmg` builds are NOT fully trusted consumer releases:
              Gatekeeper will warn. Right-click > Open on first launch, or distribute only
              signed + notarized builds for general users. See INSTALL.md.

            ### AI CLI policy
            - The app works with or without Codex CLI, Claude Code, or Gemini CLI installed.
            - Presence detection is optional, local-only (PATH probe, never executes
              third-party code). Detailed status runs a bounded `--version` probe
              (direct exec, no shell, 8 s timeout) and reports failures as diagnostics.
            - No third-party AI CLI executables are bundled in these installers.
