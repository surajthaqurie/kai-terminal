name: Deploy Kai Website to GitHub Pages

# Disabled automatic push/PR triggers since kai-website is deployed on Vercel.
# Can still be manually triggered via workflow_dispatch if needed.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # 1. Build & Validate Website
  # ------------------------------------------------------------------
  build-gate:
    name: Build & Validate Website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install website dependencies
        run: |
          cd kai-website
          npm ci

      - name: TypeScript Typecheck & Production Build
        run: |
          cd kai-website
          npm run build
          touch dist/.nojekyll

      - name: Upload Build Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kai-website-dist-bundle
          path: kai-website/dist
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 2. Deploy to GitHub Pages
  # ------------------------------------------------------------------
  deploy:
    name: Deploy to GitHub Pages
    needs: build-gate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Build Output Artifact
        uses: actions/download-artifact@v4
        with:
          name: kai-website-dist-bundle
          path: kai-website/dist

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "kai-website/dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
