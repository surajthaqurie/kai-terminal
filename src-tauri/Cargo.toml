[package]
name = "kai"
version = "0.2.1"
description = "Kai Terminal Rust Backend"
authors = ["surajthaqurie"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [], optional = true }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
portable-pty = "0.8"
tokio = { version = "1.40", features = ["full"] }
uuid = { version = "1.10", features = ["v4", "fast-rng"] }
thiserror = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"], optional = true }
futures-util = { version = "0.3", optional = true }
tauri = { version = "2.1.0", features = [], optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }

[features]
default = ["tauri"]
tauri = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-single-instance", "dep:reqwest", "dep:futures-util"]
tauri-build = ["dep:tauri-build"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
